brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
# 单机演示：允许自动创建 Topic，生产环境请关闭并按需申请
autoCreateTopicEnable=true
listenPort=10911
# 生产者/消费者批量与压缩（高并发场景）
sendMessageThreadPoolNums=16
pullMessageThreadPoolNums=32
useRejectQueue=true
