services:
  # ===================== 基础设施 =====================
  mysql:
    image: mysql:8.0
    container_name: baizhan-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: baizhan123
      MYSQL_DATABASE: baizhanshopping
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./baizhanshopping.sql:/docker-entrypoint-initdb.d/baizhanshopping.sql:ro
      - ./migrations/01-optimize.sql:/docker-entrypoint-initdb.d/02-optimize.sql:ro
    ports:
      - "3306:3306"
    networks: [baizhan-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pbaizhan123"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: baizhan-redis
    command: redis-server --requirepass baizhan123 --appendonly yes
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks: [baizhan-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "baizhan123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: baizhan-nacos
    environment:
      MODE: standalone
      JVM_XMS: 128m
      JVM_XMX: 256m
      TZ: Asia/Shanghai
    volumes:
      - nacos-logs:/home/nacos/logs
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    networks: [baizhan-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ===================== RocketMQ（镜像 tag 需与客户端版本对齐，均为 5.3.2）=====================
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: baizhan-rocketmq-namesrv
    command: sh mqnamesrv
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9876:9876"
    networks: [baizhan-net]
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: baizhan-rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - rocketmq-data:/home/rocketmq/logs
    environment:
      TZ: Asia/Shanghai
      # 演示环境压低堆内存，避免整机 OOM（默认 1G 堆 + 页缓存约 2.4G RSS）
      JAVA_OPT_EXT: "-server -Xms256m -Xmx512m"
    ports:
      - "10911:10911"
      - "10909:10909"
    depends_on: [rocketmq-namesrv]
    networks: [baizhan-net]
    restart: unless-stopped

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: baizhan-rocketmq-dashboard
    environment:
      JAVA_OPTS: -Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dserver.port=8080
      TZ: Asia/Shanghai
    ports:
      - "8180:8080"
    depends_on: [rocketmq-namesrv]
    networks: [baizhan-net]
    restart: unless-stopped

  # ===================== MinIO =====================
  minio:
    image: minio/minio:latest
    container_name: baizhan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [baizhan-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc
    container_name: baizhan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/baizhan &&
             mc anonymous set download local/baizhan"
    networks: [baizhan-net]
    restart: "no"

  # ===================== 网关（Higress 云原生网关） =====================
  # 说明：镜像使用阿里云 ACR 路径（国内可直接拉取）；
  # 官方路径为 higress/all-in-one:latest，网络畅通地区可自行替换
  higress:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:latest
    container_name: baizhan-higress
    ports:
      - "8080:8080"   # 网关 HTTP 入口（替代原 Spring Cloud Gateway 9000）
      - "8001:8001"   # Higress 控制台
    volumes:
      # 路由（Ingress）与服务来源（McpBridge 对接 Nacos）配置
      - ./higress/data:/data
    depends_on:
      nacos:
        condition: service_healthy
    networks: [baizhan-net]
    restart: unless-stopped

  # ===================== 业务服务 =====================
  baizhan-auth:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        JAR_FILE: baizhan-auth/target/baizhan-auth-1.0.0.jar
    image: baizhan-auth:1.0.0
    container_name: baizhan-auth
    environment:
      JAVA_OPTS: -Xms128m -Xmx320m
      MYSQL_HOST: mysql
      NACOS_SERVER: nacos:8848
      AUTH_INIT_DEMO: "true"
      TZ: Asia/Shanghai
    ports:
      - "9101:9101"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks: [baizhan-net]
    restart: unless-stopped

  baizhan-user:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        JAR_FILE: baizhan-user/target/baizhan-user-1.0.0.jar
    image: baizhan-user:1.0.0
    container_name: baizhan-user
    environment:
      JAVA_OPTS: -Xms128m -Xmx320m
      MYSQL_HOST: mysql
      NACOS_SERVER: nacos:8848
      TZ: Asia/Shanghai
    ports:
      - "9102:9102"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks: [baizhan-net]
    restart: unless-stopped

  baizhan-product:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        JAR_FILE: baizhan-product/target/baizhan-product-1.0.0.jar
    image: baizhan-product:1.0.0
    container_name: baizhan-product
    environment:
      JAVA_OPTS: -Xms128m -Xmx320m
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      REDIS_PASSWORD: baizhan123
      NACOS_SERVER: nacos:8848
      TZ: Asia/Shanghai
    ports:
      - "9103:9103"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks: [baizhan-net]
    restart: unless-stopped

  baizhan-order:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        JAR_FILE: baizhan-order/target/baizhan-order-1.0.0.jar
    image: baizhan-order:1.0.0
    container_name: baizhan-order
    environment:
      JAVA_OPTS: -Xms128m -Xmx320m
      MYSQL_HOST: mysql
      NACOS_SERVER: nacos:8848
      ROCKETMQ_ENABLED: "true"
      ROCKETMQ_ADDR: rocketmq-namesrv:9876
      TZ: Asia/Shanghai
    ports:
      - "9104:9104"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      baizhan-product:
        condition: service_started
    networks: [baizhan-net]
    restart: unless-stopped

  # ===================== 前端 =====================
  baizhan-frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    image: baizhan-frontend:1.0.0
    container_name: baizhan-frontend
    ports:
      - "80:80"
    depends_on:
      - higress
    networks: [baizhan-net]
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  nacos-logs:
  minio-data:
  rocketmq-data:

networks:
  baizhan-net:
    driver: bridge
