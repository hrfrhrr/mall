apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: baizhan-user
  namespace: higress-system
  annotations:
    higress.io/destination: baizhan-user.DEFAULT-GROUP.public.nacos
spec:
  rules:
    - http:
        paths:
          - path: /api/user
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
