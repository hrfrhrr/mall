apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: baizhan-product
  namespace: higress-system
  annotations:
    higress.io/destination: baizhan-product.DEFAULT-GROUP.public.nacos
spec:
  rules:
    - http:
        paths:
          - path: /api/product
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
